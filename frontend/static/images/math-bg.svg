<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
  <!-- Decorative background tile. Very low opacity so it never competes with content. -->
  <g fill="#2563EB" fill-opacity="0.07" font-family="Cambria Math, STIX Two Math, Georgia, Times New Roman, serif" font-style="italic">
    <text x="30"  y="70"  font-size="26" transform="rotate(-4 30 70)">x = (−b ± √(b² − 4ac)) / 2a</text>
    <text x="400" y="120" font-size="24" transform="rotate(3 400 120)">∫ x² dx = x³/3 + C</text>
    <text x="90"  y="230" font-size="24">det(A) = ad − bc</text>
    <text x="360" y="300" font-size="26" transform="rotate(-3 360 300)">σ² = Σ(xᵢ − μ)² / n</text>
    <text x="20"  y="400" font-size="24" transform="rotate(4 20 400)">Aυ = λυ</text>
    <text x="250" y="470" font-size="24">xₙ₊₁ = xₙ − f(xₙ) / f′(xₙ)</text>
    <text x="470" y="560" font-size="26" transform="rotate(-5 470 560)">eⁱπ + 1 = 0</text>
    <text x="40"  y="620" font-size="24" transform="rotate(-2 40 620)">F = ma</text>
    <text x="300" y="680" font-size="24">PV = nRT</text>
    <text x="560" y="410" font-size="24">y = mx + c</text>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round">
    <path d="M430 220 H700 M440 130 V250"/>
    <path d="M440 200 C490 120 520 120 560 200 S640 280 690 200"/>
    <path d="M60 480 H210 M70 440 V540"/>
    <path d="M70 520 Q130 400 200 520"/>
  </g>
</svg>
